<svg width="1000" height="240" viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">RizqAI</title>
  <desc id="desc">RizqAI wordmark with the tagline "Intelligent Provision".</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5C7" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#6D28D9" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="45%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#00C2A8"/>
    </linearGradient>

    <filter id="blurGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- soft lit glow behind the wordmark, no background fill so it merges with the page -->
  <ellipse cx="500" cy="112" rx="260" ry="88" fill="url(#glow)" filter="url(#blurGlow)"/>

  <!-- wordmark -->
  <text x="500" y="144" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-weight="700" font-size="108" fill="url(#textGrad)">Rizq<tspan dx="-22" fill="#00E5C7">AI</tspan></text>

  <!-- delicate flourish rule -->
  <path d="M368 172 Q500 190 632 172" fill="none" stroke="url(#textGrad)" stroke-width="1.6" stroke-opacity="0.65"/>
  <circle cx="500" cy="188" r="2.6" fill="#00E5C7"/>

  <!-- tagline -->
  <text x="500" y="216" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" letter-spacing="3.5" fill="#8B87A8" font-weight="600">MULTI-AGENT FINANCIAL RESEARCH</text>
</svg>