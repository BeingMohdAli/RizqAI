<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">RizqAI</title>
  <desc id="desc">RizqAI wordmark — multi-agent financial research.</desc>
  <defs>
    <linearGradient id="plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B1E"/>
      <stop offset="55%" stop-color="#150F2E"/>
      <stop offset="100%" stop-color="#1A1035"/>
    </linearGradient>

    <linearGradient id="plateBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#DB2777" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.7"/>
    </linearGradient>

    <radialGradient id="innerGlow" cx="30%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="innerGlow2" cx="80%" cy="85%" r="70%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="45%" stop-color="#C026D3"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>

    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="ruleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="plateShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- dark plate so the gradient truly pops -->
  <rect x="40" y="20" width="920" height="220" rx="30" fill="url(#plate)" filter="url(#plateShadow)"/>
  <rect x="40" y="20" width="920" height="220" rx="30" fill="none" stroke="url(#plateBorder)" stroke-width="1.5"/>
  <rect x="40" y="20" width="920" height="220" rx="30" fill="url(#innerGlow)"/>
  <rect x="40" y="20" width="920" height="220" rx="30" fill="url(#innerGlow2)"/>

  <!-- wordmark -->
  <text x="500" y="150" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-weight="700" font-size="102" fill="url(#textGrad)" filter="url(#textGlow)">Rizq<tspan dx="-20" fill="url(#aiGrad)">AI</tspan></text>

  <!-- delicate flourish rule -->
  <path d="M368 180 Q500 198 632 180" fill="none" stroke="url(#ruleGrad)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9"/>
  <circle cx="500" cy="197" r="3" fill="#22D3EE"/>

  <!-- tagline -->
  <text x="500" y="224" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" letter-spacing="3.5" fill="#A5A0C9" font-weight="600">MULTI-AGENT FINANCIAL RESEARCH</text>
</svg>
