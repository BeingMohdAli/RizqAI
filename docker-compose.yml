services:
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    healthcheck:
      test: [
        "CMD", "python", "-c",
        "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/conversations/health').getcode() == 200 else 1)"
      ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy